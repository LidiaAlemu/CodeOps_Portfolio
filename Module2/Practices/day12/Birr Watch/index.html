<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birr Watch</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>

        <h1>Birr Watch</h1>
        <p id="status">Loadng Rates ....</p>

        <form id="covert-form">
            <label for="amount">Amount in ETB</label>
            <input type="number" id="amount" name="amount" value="100" min="0" required>

            <label for="currency">Convert to</label>
            <select id="currency">
            <button type="submit">Covert</button>
        </form>

        <p id="result"></p>
        <button id="watch" type="button">Add to Watch list</button>

        <section>
            <h2>My Watch List</h2>

            <ul id="watchlist"></ul>
        </section>

    </main>
    
    <script src="app.js"></script>
    
</body>
</html>
