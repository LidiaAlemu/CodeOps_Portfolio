<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3</title>
    <style>
        button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            background: #1f6f43;
            color: white;
            cursor: pointer;
}
    </style>
</head>
<body>
    
    <div id="wrapper">
        <button id="btn">Click me</button>
    </div>

    <script>
        const btn = document.querySelector("#btn");
        const wrapper = document.querySelector("#wrapper");

        btn.addEventListener("click", function(e) {
            console.log("button clicked, target:", e.target);
            console.log("currentTarget (button):", e.currentTarget);
        });

        wrapper.addEventListener("click", function(e) {
            console.log("wrapper clicked (bubbled), target:", e.target);
            console.log("currentTarget (wrapper):", e.currentTarget);
        });
    </script>
</body>
</html>
